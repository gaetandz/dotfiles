---
# tasks file for ssh
- name: Create ssh directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    owner: "{{ ansible_user }}"
    mode: '0700'

- name: Import ssh config
  ansible.builtin.template:
    src: ssh_config
    dest: "{{ ansible_env.HOME }}/.ssh/config"
    owner: "{{ ansible_user }}"
    mode: '0640'

- name: Import ssh private keys
  no_log: true
  ansible.builtin.copy:
    content: "{{ item.private_key }}"
    dest: "{{ ansible_env.HOME }}/.ssh/{{ item.name }}"
    owner: "{{ ansible_user }}"
    mode: '0600'
  with_items: "{{ ssh_keys }}"

- name: Format private keys
  no_log: true
  ansible.builtin.replace:
    path: "{{ ansible_env.HOME }}/.ssh/{{ item.name }}"
    regexp: "\n"
    replace: "\\n"
  with_items: "{{ ssh_keys }}"

- name: Import ssh public keys
  no_log: true
  ansible.builtin.copy:
    content: "{{ item.public_key }}"
    dest: "{{ ansible_env.HOME }}/.ssh/{{ item.name }}.pub"
    owner: "{{ ansible_user }}"
    mode: '0600'
  with_items: "{{ ssh_keys }}"
